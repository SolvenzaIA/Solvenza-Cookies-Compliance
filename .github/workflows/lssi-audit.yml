name: LSSI & AEPD Cookie Compliance Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly automated audit on Mondays at 08:00 AM UTC
    - cron: '0 8 * * 1'

jobs:
  lssi-compliance-gate:
    name: Audit LSSI & AEPD Compliance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Library
        run: npm run build

      - name: Run LSSI / AEPD Cookie Compliance Audit
        uses: ./
        with:
          config-path: 'examples/vanilla-html/consent.json'
          src-dir: 'src'
          fail-on-error: 'true'
